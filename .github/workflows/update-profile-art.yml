# .github/workflows/update-profile-art.yml
name: Update Profile Art

on:
  schedule:
    - cron: "0 0 * * *"  # Runs at 00:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install pillow numpy requests

      - name: Generate ASCII Portrait
        run: |
          python scripts/prep_photo.py source-photo.jpg source-prepped.png
          python scripts/make_ascii_svg.py source-prepped.png umar-ascii.svg

      - name: Generate Info Card
        run: python scripts/make_info_card.py info-card.svg

      - name: Generate Contribution Graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/make_contribution_graph.py UmarAftab174 contribution-graph.svg

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add umar-ascii.svg info-card.svg contribution-graph.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile art [skip ci]"
          git push