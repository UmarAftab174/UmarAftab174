# .github/workflows/update-profile-art.yml
name: Update Profile Art

on:
  schedule:
    - cron: "0 0 * * *"  # Runs at 00:00 UTC daily
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install numpy opencv-python pillow

      - name: Generate ASCII Portrait
        run: |
          python scripts/prep_photo.py source-photo.jpg source-prepped.png
          python scripts/make_ascii_svg.py source-prepped.png umar-ascii.svg

      - name: Generate Info Card
        run: python scripts/make_info_card.py info-card.svg

      - name: Update Contribution Heatmap
        uses: action-gh-contrib/gh-contrib@main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_FILE: contrib-heatmap.svg
          STYLE: "dark"

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add umar-ascii.svg info-card.svg contrib-heatmap.svg
          git commit -m "chore: refresh profile art [skip ci]"
          git push